#!/usr/bin/env python
PACKAGE = "hero_chassis_controller"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("p", double_t, 0, "Proportional gain", 2.0, 0.0, 20.0)
gen.add("i", double_t, 0, "Integral gain", 0.0, 0.0, 5.0)
gen.add("d", double_t, 0, "Derivative gain", 0.0, 0.0, 5.0)
gen.add("i_max", double_t, 0, "Integral max", 5.0, 0.0, 20.0)
gen.add("i_min", double_t, 0, "Integral min", -5.0, -20.0, 0.0)

exit(gen.generate(PACKAGE, "hero_chassis_controller", "Pid"))
